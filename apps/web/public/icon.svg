<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Cosmic Obsidian Depth -->
    <radialGradient id="formu-glow" cx="50%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#9333EA" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="formu-bg" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0B0F1D" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Beveled Edge Rim Light -->
    <linearGradient id="formu-rim" x1="12" y1="4" x2="88" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.85" />
      <stop offset="30%" stop-color="#C084FC" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#F43F5E" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.35" />
    </linearGradient>

    <!-- F Spine Gradient: Electric Cyan to Indigo to Violet -->
    <linearGradient id="formu-spine" x1="26" y1="22" x2="70" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="32%" stop-color="#6366F1" />
      <stop offset="72%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Dynamic Form Crossbar: Rose / Fuchsia Glow -->
    <linearGradient id="formu-bar" x1="36" y1="44" x2="68" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>

    <!-- Drop Shadow for 3D Floating Geometry -->
    <filter id="formu-shadow" x="16" y="14" width="66" height="66" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3.5" stdDeviation="4" flood-color="#4F46E5" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Container Squircle Base -->
  <rect width="96" height="96" rx="24" fill="url(#formu-bg)" />
  <rect width="96" height="96" rx="24" fill="url(#formu-glow)" />
  <rect x="0.75" y="0.75" width="94.5" height="94.5" rx="23.25" stroke="url(#formu-rim)" stroke-width="1.5" />

  <!-- The Architectural F Mark with 3D Layers -->
  <g filter="url(#formu-shadow)">
    <!-- Main Spine & Top Hook (Continuous Geometric Ribbon) -->
    <path d="M28 70C28 71.6569 29.3431 73 31 73H36C37.6569 73 39 71.6569 39 70V34.5H63C65.8954 34.5 68.25 32.1454 68.25 29.25C68.25 26.3546 65.8954 24 63 24H34.5C30.9101 24 28 26.9101 28 30.5V70Z" fill="url(#formu-spine)" />

    <!-- Specular Highlight Overlay on Top Arm -->
    <path d="M34.5 24.5H63C65.5 24.5 67.5 26.5 67.5 29C67.5 27.8 65.5 25.2 63 25.2H34.5C31.3 25.2 28.5 27.8 28.4 31C28.5 28 31.3 24.5 34.5 24.5Z" fill="#FFFFFF" fill-opacity="0.55" />

    <!-- Middle Floating Wing / Form Pill with Glow -->
    <rect x="35" y="44" width="30" height="10.5" rx="5.25" fill="url(#formu-bar)" />
    <!-- Inner glass bevel on crossbar -->
    <rect x="35.5" y="44.5" width="29" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.3" />
  </g>
</svg>